[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gena-code"
dynamic = ["version"]
description = "Queqiao-2 GENA and coordinated space-physics analysis tools"
requires-python = ">=3.12,<3.15"
dependencies = [
    "astropy>=7,<9",
    "imageio-ffmpeg>=0.6,<1", # Bundled ffmpeg executable for MP4 export.
    "jplephem>=2.22,<3",
    "lunardate>=0.2,<1",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pyarrow>=18,<24",
    "plotly>=6,<7",
    "pyspedas>=2,<3",
    "scipy>=1.14,<2",
    "spacepy>=0.7,<1",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
3d = ["geopack>=1.0,<2"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "gena._version.__version__"}

[tool.setuptools.packages.find]
include = ["common", "common.*", "gena", "gena.*", "libs", "libs.*", "load", "load.*", "plots", "plots.*"]
namespaces = true

[tool.setuptools.package-data]
libs = ["de432s.bsp", "orbits_all.npz", "orbits_all.meta.json"]
