[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gena-code"
version = "0.1.0"
description = "Queqiao-2 GENA and coordinated space-physics analysis tools"
requires-python = ">=3.12,<3.15"
dependencies = [
    "astropy>=7,<9",
    "imageio-ffmpeg>=0.6,<1", # Bundled ffmpeg executable for MP4 export.
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=3,<4",
    "pyarrow>=18,<24",
    "plotly>=6,<7",
    "pyspedas>=2,<3",
    "scipy>=1.14,<2",
    "spacepy>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
